# Publie le site sur GitHub Pages à chaque envoi sur `main`.
#
# Le travail est coupé en deux volontairement. Un job qui déclare
# `environment: github-pages` échoue immédiatement si cet environnement
# n'existe pas encore — or il n'est créé qu'au moment où Pages est activé.
# Le premier job active donc Pages (`enablement: true`) sans déclarer
# d'environnement ; le second, qui démarre après, le trouve en place.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans interrompre celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparer:
    name: Activer Pages et préparer le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          # Le site est servi tel quel : ni compilation, ni dépendances.
          path: .

  deployer:
    name: Déployer
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre le site en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
