# Les tests tournent sans rien installer : Node suffit, le dépôt n'a aucune
# dépendance. Voir `tests/` et `npm test`.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
